# Build the pkgdown site and deploy it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false

      # ckdata requires dbplyr < 2.6.0, but the default repositories only carry
      # 2.6.0. Pin the package repo to a dated snapshot that still has 2.5.2 (with
      # noble binaries) so the dependency install resolves. Drop once the cap is
      # lifted (see the note on the install step in the Datalake 'Connect' guide).
      - name: Pin the package repo (dbplyr < 2.6.0)
        run: echo 'options(repos = c(CRAN = "https://p3m.dev/cran/__linux__/noble/2026-06-15"))' >> ~/.Rprofile

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
